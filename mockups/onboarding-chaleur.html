<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fairide — accueil plus chaleureux</title>
<!--
  Maquette (2026-10-16) : l'accueil de l'app « un peu froid » (retour du fondateur). Quatre versions des mêmes écrans,
  côte à côte, cliquables : on choisit, puis on code la version retenue dans src/pages/app/ (EcransBienvenue.jsx).
  Rien n'est branché. Textes : ceux de l'app (fr.js, après le passage « humaniser »), sauf la version D qui propose
  quelques tournures plus familières, signalées.

  Ouvrir : double-clic, ou `npm run dev -- --host` puis /mockups/onboarding-chaleur.html depuis le téléphone (même Wi-Fi).

  Règles de l'identité gardées : fond blanc ou iris, lime seulement en aplat avec texte encre (ou sur iris), un seul
  accent lime par écran, icônes au trait de Icone.jsx, pas d'emoji.
-->
<style>
@font-face { font-family: 'Inter'; font-weight: 400 700; font-display: swap;
  src: url('/fonts/inter-latin.woff2') format('woff2'), url('../public/fonts/inter-latin.woff2') format('woff2'); }
@font-face { font-family: 'Inter Tight'; font-weight: 500 700; font-display: swap;
  src: url('/fonts/inter-tight-latin.woff2') format('woff2'), url('../public/fonts/inter-tight-latin.woff2') format('woff2'); }
@font-face { font-family: 'Bricolage Grotesque'; font-weight: 700 800; font-display: swap;
  src: url('/fonts/bricolage-grotesque-latin.woff2') format('woff2'), url('../public/fonts/bricolage-grotesque-latin.woff2') format('woff2'); }
:root {
  --iris: #3B2FB5; --iris-deep: #2A2185; --lime: #C8F03C; --ink: #14121F; --ink-soft: #6B655D; --ink-faint: #8A8377;
  --line: #DCD8D0; --ressort: cubic-bezier(.34, 1.4, .64, 1);
}
* { box-sizing: border-box; }
body { margin: 0; background: #ECEAE4; color: var(--ink); font-family: 'Inter', system-ui, sans-serif; }
.page { max-width: 1680px; margin: 0 auto; padding: 28px 16px 60px; }
.page > h1 { font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 28px; margin: 0 0 6px; }
.page > p { color: var(--ink-soft); max-width: 760px; margin: 0 0 22px; line-height: 1.5; }
.rangee { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
.colonne { width: 375px; max-width: 100%; }
.colonne h2 { font-size: 17px; margin: 0 0 4px; }
.colonne .note { font-size: 13px; color: var(--ink-soft); line-height: 1.45; min-height: 58px; margin: 0 0 10px; }
.tel { position: relative; width: 375px; max-width: 100%; height: 667px; border-radius: 34px; overflow: hidden; background: #fff; border: 1px solid #CFCBC2; }
.remettre { margin-top: 10px; background: none; border: 1px solid #CFCBC2; border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; }

/* ---------- L'écran, commun aux quatre versions ---------- */
.ecran { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 18px 22px 24px; animation: entre .28s ease; }
@keyframes entre { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.haut { display: flex; align-items: center; gap: 12px; min-height: 36px; margin-bottom: 14px; }
.rond { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; cursor: pointer; color: inherit; flex: none; padding: 0; }
.progression { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.progression i { display: block; height: 100%; background: var(--iris); transition: width .35s; }
.langues { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; color: var(--ink-soft); }
.titre { font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 30px; line-height: 1.08; letter-spacing: -0.02em; margin: 6px 0 10px; font-weight: 700; }
.titre .marque { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; letter-spacing: -0.03em; }
.sous { font-size: 15px; line-height: 1.45; color: var(--ink-soft); margin: 0 0 18px; }
.grandit { flex: 1; min-height: 12px; }
.option { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 16px; padding: 13px 14px; margin-bottom: 10px; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s, transform .12s; }
.option small { display: block; font-weight: 400; color: var(--ink-soft); margin-top: 2px; font-size: 13px; }
.option .tuile { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); color: var(--iris); display: grid; place-items: center; flex: none; }
.option.on { background: var(--iris); border-color: var(--iris); color: #fff; }
.option.on small { color: rgba(255,255,255,.8); }
.option.on .tuile { color: #fff; border-color: rgba(255,255,255,.4); }
.option:active { transform: scale(.98); }
.case { margin-left: auto; width: 22px; height: 22px; border-radius: 8px; border: 1px solid var(--line); flex: none; display: grid; place-items: center; }
.option.on .case { border-color: #fff; }
.fait { display: flex; gap: 14px; align-items: flex-start; border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
.fait .tuile { width: 40px; height: 40px; border-radius: 12px; background: var(--iris); color: #fff; display: grid; place-items: center; flex: none; }
.fait b { display: block; font-size: 16px; }
.fait span { display: block; font-size: 12.5px; color: var(--ink-faint); margin-top: 3px; line-height: 1.4; }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; margin-top: 10px; font: inherit; font-size: 16px; font-weight: 700;
  border-radius: 999px; border: 0; cursor: pointer; transition: transform .12s, background .2s, color .2s; }
.btn:active { transform: scale(.97); }
.btn.iris { background: var(--iris); color: #fff; }
.btn.lime { background: var(--lime); color: var(--ink); }
.btn:disabled { background: var(--line); color: var(--ink-faint); cursor: default; transform: none; }

/* ---------- B : bouton lime ---------- */
/* Rien d'autre ne change : c'est le test le plus simple. Une seule touche de lime par écran, le bouton. */

/* ---------- C : le vélo avance ---------- */
/* La barre de progression devient une route : le vélo de la marque la parcourt à chaque écran, en petits bonds. Le choix
   fait apparaître une coche lime (aplat, trait encre) qui « saute » dans la case. */
.route { position: relative; flex: 1; height: 22px; }
.route::before { content: ''; position: absolute; left: 0; right: 0; top: 17px; border-top: 2px dashed var(--line); }
.route .fait-route { position: absolute; left: 0; top: 16px; height: 4px; border-radius: 2px; background: var(--iris); transition: width .7s cubic-bezier(.3, .7, .4, 1); }
.route .velo { position: absolute; top: 0; width: 34px; margin-left: -17px; transition: left .7s cubic-bezier(.3, .7, .4, 1); }
.route .velo.roule svg { animation: bonds .7s ease-in-out; }
@keyframes bonds { 0%, 100% { transform: none; } 20%, 60% { transform: translateY(-2px) rotate(-3deg); } 40%, 80% { transform: translateY(0) rotate(1deg); } }
.v-c .option.on .case, .v-d .option.on .case { background: var(--lime); border-color: var(--lime); color: var(--ink); animation: saute .3s var(--ressort); }
@keyframes saute { from { transform: scale(.3); } to { transform: none; } }
.v-c .option.on .tuile, .v-d .option.on .tuile { animation: saute .3s var(--ressort); }

/* ---------- D : un bandeau iris qui accueille ---------- */
/* Le haut de chaque écran est iris (la « frame » de la marque), le vélo y passe ; les choix montent dans une feuille
   blanche aux coins ronds. Quelques tournures plus familières (signalées en italique dans la note). */
.v-d .ecran { padding: 0; }
.v-d .bandeau { background: var(--iris); color: #fff; padding: 18px 22px 34px; position: relative; overflow: hidden; }
.v-d .bandeau .rond { border-color: rgba(255,255,255,.35); }
.v-d .bandeau .langues { border-color: rgba(255,255,255,.35); color: rgba(255,255,255,.85); }
.v-d .bandeau .route::before { border-top-color: rgba(255,255,255,.3); }
.v-d .bandeau .route .fait-route { background: var(--lime); }
.v-d .bandeau .sous { color: rgba(255,255,255,.82); margin-bottom: 0; }
.v-d .feuille { flex: 1; display: flex; flex-direction: column; background: #fff; border-radius: 26px 26px 0 0; margin-top: -22px; padding: 22px 22px 24px; position: relative; animation: monte .4s var(--ressort); }
@keyframes monte { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.v-d .salut { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; background: var(--lime); color: var(--ink); padding: 5px 10px; border-radius: 999px; margin: 4px 0 4px; }
.v-d .fait .tuile { background: transparent; color: var(--iris); border: 1px solid var(--line); }

@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="page">
  <h1>Un accueil plus chaleureux : quatre essais</h1>
  <p>Les mêmes trois écrans (« Tu es… », « Qu'est-ce qui compte pour toi ? », « Pourquoi passer à Fairide ? ») dans quatre versions.
    Touche les choix et « Continuer » dans chaque téléphone. A est l'app d'aujourd'hui, pour comparer.</p>
  <div class="rangee" id="rangee"></div>
</div>

<script>
const ICONES = {
  retour: '<path d="M15 5 8 12l7 7"/>',
  valider: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  sac: '<path d="M5 8h14l-1 12a1 1 0 0 1-1 .9H7a1 1 0 0 1-1-.9L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  scooter: '<circle cx="5.5" cy="17.5" r="2.5"/><circle cx="18.5" cy="17.5" r="2.5"/><path d="M8 17.5h8"/><path d="M18.5 17.5 16 7h-3"/><path d="M5.5 15V12h6l3.5 5.5"/>',
  commerce: '<path d="M4 9h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9Z"/><path d="M3 9 5 4h14l2 5"/><path d="M9 21v-6h6v6"/>',
  euro: '<circle cx="12" cy="12" r="9"/><path d="M16 9.2A4.3 4.3 0 0 0 13 8c-2.2 0-4 1.8-4 4s1.8 4 4 4a4.3 4.3 0 0 0 3-1.2"/><path d="M7.5 11h5"/><path d="M7.5 13.5h5"/>',
  balance: '<path d="M12 4v17"/><path d="M4 8.5h16"/><path d="m4 8.5-2.2 6h4.4Z"/><path d="m20 8.5-2.2 6h4.4Z"/><path d="M8 21h8"/><circle cx="12" cy="4" r="1.2"/>',
  ticket: '<path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h15A1.5 1.5 0 0 1 21 7.5V10a2 2 0 0 0 0 4v2.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 16.5V14a2 2 0 0 0 0-4V7.5Z"/><path d="M13 9.5v5"/>',
  boussole: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/>'
};
const ic = (n, t = 20) => `<svg width="${t}" height="${t}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONES[n]}</svg>`;
// Le vélo « 5a », sans tuile (BrandMark.jsx), à la couleur donnée.
const velo = (c) => `<svg viewBox="-3 5 82 42" width="34" height="18" aria-hidden="true"><g fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"><circle cx="15" cy="29" r="12.5"/><circle cx="61" cy="29" r="12.5"/></g><g fill="${c}"><rect x="16" y="8" width="44" height="5" rx="2.5"/><g transform="rotate(42 27 22.5)"><rect x="13" y="20" width="28" height="5" rx="2.5"/></g></g></svg>`;

const PROFILS = [['client', 'sac', 'Je veux commander', 'Repas et courses près de chez moi'], ['driver', 'scooter', 'Je veux livrer', 'Indépendant, à vélo ou motorisé'], ['restaurant', 'commerce', 'J’ai un commerce', 'Restaurant, snack, boulangerie, épicerie…']];
const BUTS = [['prix', 'euro', 'Les prix du commerce', 'Une carte qui n’est pas gonflée pour payer la commission'], ['juste', 'balance', 'Un prix juste et clair', 'Payer le total que j’avais en tête'], ['local', 'commerce', 'Soutenir les commerces d’ici', 'Le snack, la pizzeria, la boulangerie d’à côté'], ['decouvrir', 'boussole', 'Découvrir des adresses près de chez moi', 'Ta commune d’abord']];
const FAITS = [['euro', '10 % de commission', 'Les autres applis prennent 22 à 32 % au commerce. Avec 10 %, il n’a pas besoin de gonfler sa carte.'], ['ticket', 'Aucun frais ajouté au paiement', 'Tu paies les plats et la livraison, rien d’autre.'], ['balance', 'Le commerce et le livreur gardent l’essentiel', 'Le commerce garde la plus grande partie de chaque commande, et ton livreur touche tous tes pourboires.']];

const VERSIONS = [
  { id: 'a', nom: 'A · Aujourd’hui', note: 'L’app telle qu’elle est : bouton iris, barre de progression fine.', bouton: 'iris' },
  { id: 'b', nom: 'B · Bouton lime', note: 'Seul changement : « Continuer » passe en lime, texte encre. La couleur la plus gaie de la marque, à l’endroit où l’on appuie.', bouton: 'lime' },
  { id: 'c', nom: 'C · Le vélo avance', note: 'Bouton lime, et la progression devient une route : le vélo de la marque avance d’un écran à l’autre. Un choix fait « sauter » une coche lime.', bouton: 'lime', route: true },
  { id: 'd', nom: 'D · Bandeau iris', note: 'C, plus un haut d’écran iris qui accueille et une feuille blanche pour les choix. Tournures plus familières proposées : « Salut ! », « Coche tout ce qui te parle ».', bouton: 'lime', route: true, bandeau: true }
];
const TITRES = {
  profil: (v) => v.bandeau ? 'Qu’est-ce qui t’amène sur <span class="marque">fairide</span> ?' : 'Bienvenue sur <span class="marque">fairide</span>. Tu es…',
  buts: () => 'Qu’est-ce qui compte pour toi ?',
  pourquoi: () => 'Pourquoi passer à <span class="marque">fairide</span> ?'
};
const SOUS = {
  profil: (v) => v.bandeau ? 'On adapte la suite à ce que tu viens faire.' : 'On adapte la suite à ce que tu viens faire.',
  buts: (v) => v.bandeau ? 'Coche tout ce qui te parle.' : 'Plusieurs choix possibles.',
  pourquoi: () => 'Trois différences avec les autres applis.'
};
const ECRANS = ['profil', 'buts', 'pourquoi'];

function monter(v) {
  const col = document.createElement('div');
  col.className = 'colonne';
  col.innerHTML = `<h2>${v.nom}</h2><p class="note">${v.note}</p><div class="tel v-${v.id}"></div><button class="remettre" type="button">Recommencer</button>`;
  const tel = col.querySelector('.tel');
  const etat = { i: 0, role: null, buts: [], avant: 0 };
  col.querySelector('.remettre').onclick = () => { Object.assign(etat, { i: 0, role: null, buts: [], avant: 0 }); dessiner(); };

  function haut() {
    const p = (etat.i + 1) / (ECRANS.length + 3); // l'accueil compte d'autres écrans après ceux-ci
    const retour = `<button class="rond" type="button" data-retour aria-label="Retour">${ic('retour', 18)}</button>`;
    if (!v.route) return `<div class="haut">${retour}<div class="progression"><i style="width:${Math.round(p * 100)}%"></i></div><span class="langues">FR</span></div>`;
    const pAvant = (etat.avant + 1) / (ECRANS.length + 3);
    const couleur = v.bandeau ? '#C8F03C' : '#3B2FB5';
    return `<div class="haut">${retour}<div class="route"><i class="fait-route" style="width:${pAvant * 100}%"></i><span class="velo" style="left:${pAvant * 100}%">${velo(couleur)}</span></div><span class="langues">FR</span></div>`;
  }
  function corps(nom) {
    if (nom === 'profil') return PROFILS.map(([val, icone, t, s]) => `<button type="button" class="option${etat.role === val ? ' on' : ''}" data-role="${val}"><span class="tuile">${ic(icone)}</span><span>${t}<small>${s}</small></span></button>`).join('');
    if (nom === 'buts') return BUTS.map(([val, icone, t, s]) => `<button type="button" class="option${etat.buts.includes(val) ? ' on' : ''}" data-but="${val}"><span class="tuile">${ic(icone)}</span><span>${t}<small>${s}</small></span><span class="case">${etat.buts.includes(val) ? ic('valider', 14) : ''}</span></button>`).join('');
    return FAITS.map(([icone, t, s]) => `<div class="fait"><span class="tuile">${ic(icone)}</span><div><b>${t}</b><span>${s}</span></div></div>`).join('');
  }
  function bouton(nom) {
    const actif = nom !== 'profil' || etat.role;
    const texte = nom === 'pourquoi' ? 'Trouver mes commerces' : nom === 'buts' && !etat.buts.length ? 'Passer' : 'Continuer';
    return `<button type="button" class="btn ${v.bouton}" data-suite ${actif ? '' : 'disabled'}>${texte}</button>`;
  }
  function dessiner() {
    const nom = ECRANS[etat.i];
    const titre = `<h1 class="titre">${TITRES[nom](v)}</h1><p class="sous">${SOUS[nom](v)}</p>`;
    const salut = v.bandeau && nom === 'profil' ? '<span class="salut">Salut !</span>' : '';
    tel.innerHTML = v.bandeau
      ? `<div class="ecran"><div class="bandeau">${haut()}${salut}${titre}</div><div class="feuille">${corps(nom)}<div class="grandit"></div>${bouton(nom)}</div></div>`
      : `<div class="ecran">${haut()}${titre}${corps(nom)}<div class="grandit"></div>${bouton(nom)}</div>`;
    // Le vélo part de l'écran d'avant et roule jusqu'à celui-ci.
    if (v.route && etat.avant !== etat.i) {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const p = (etat.i + 1) / (ECRANS.length + 3);
        const route = tel.querySelector('.route');
        route.querySelector('.fait-route').style.width = `${p * 100}%`;
        const vel = route.querySelector('.velo');
        vel.style.left = `${p * 100}%`;
        vel.classList.add('roule');
        etat.avant = etat.i;
      }));
    }
  }
  tel.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.role) { etat.role = b.dataset.role; dessinerSansBouger(); }
    else if (b.dataset.but) { const k = b.dataset.but; etat.buts = etat.buts.includes(k) ? etat.buts.filter((x) => x !== k) : [...etat.buts, k]; dessinerSansBouger(); }
    else if ('suite' in b.dataset) { etat.avant = etat.i; etat.i = (etat.i + 1) % ECRANS.length; if (etat.i === 0) Object.assign(etat, { role: null, buts: [], avant: 0 }); dessiner(); }
    else if ('retour' in b.dataset && etat.i > 0) { etat.avant = etat.i; etat.i -= 1; dessiner(); }
  });
  // Un choix ne rejoue pas l'entrée de l'écran : seule l'option touchée change.
  function dessinerSansBouger() {
    dessiner();
    tel.querySelector('.ecran').style.animation = 'none';
    const f = tel.querySelector('.feuille'); if (f) f.style.animation = 'none';
  }
  dessiner();
  return col;
}
const rangee = document.getElementById('rangee');
VERSIONS.forEach((v) => rangee.appendChild(monter(v)));
</script>
</body>
</html>
