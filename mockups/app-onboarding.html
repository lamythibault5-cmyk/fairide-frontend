<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fairide — onboarding de l'app</title>
<!--
  Maquette cliquable de l'onboarding de l'application (Capacitor) — skill app-onboarding-questionnaire.
  Rien n'est branché : pas d'API, pas de compte créé, commerces d'exemple. Elle sert à décider des
  écrans AVANT de les coder derrière estNatif().

  Ouvrir : double-clic sur le fichier, ou `npm run dev -- --host` puis /mockups/app-onboarding.html
  depuis le téléphone (même Wi-Fi, adresse IP du PC).

  Version 2 (2026-10-11), retours du fondateur :
  - icônes en traits, celles de src/components/Icone.jsx (pas d'emojis — voir l'en-tête de ce fichier) ;
    les cinq tracés de cuisine (pizza, burger, frites, bol, tasse) sont NOUVEAUX, à ajouter à Icone.jsx
    au moment de coder ;
  - FR / NL / EN, comme l'app ;
  - « ce qui compte » à choix multiple ; trois freins et trois cartes, centrés sur le prix ;
  - après la dernière carte on passe tout seul à « Pourquoi passer à Fairide ? » — moins cher et plus
    juste d'abord, le local en second ;
  - parcours raccourci : plus d'écran « startup belge » séparé (le bandeau reste sur l'accueil et sur
    « Pourquoi »), plus de démo « choisissez 3 commerces » ni de partage : la position mène au
    chargement, puis aux commerces trouvés, au-dessus des boutons de compte.

  Ce qui ne change pas : pas de paywall, pas de faux avis ni de chiffres inventés ; jamais « le prix du
  commerce » ni « 100 % au restaurant » côté client (CODE-3) ; compte demandé après avoir vu les commerces
  (règle 5.1.1 d'Apple), avec Apple proposé à côté de Google (règle 4.8).
-->
<style>
/* Polices de Fairide, servies localement : d'abord le chemin du serveur Vite, puis le chemin relatif
   pour une ouverture en file://. Jamais fonts.googleapis.com (voir public/fonts/polices.css). */
@font-face { font-family: 'Space Grotesk'; font-weight: 400 700; font-display: swap;
  src: url('/fonts/space-grotesk-latin.woff2') format('woff2'), url('../public/fonts/space-grotesk-latin.woff2') format('woff2'); }
@font-face { font-family: 'Bricolage Grotesque'; font-weight: 700 800; font-display: swap;
  src: url('/fonts/bricolage-grotesque-latin.woff2') format('woff2'), url('../public/fonts/bricolage-grotesque-latin.woff2') format('woff2'); }

:root {
  --iris: #3B2FB5; --iris-deep: #2A2185; --lime: #C8F03C;
  --ink: #14121F; --ink-soft: #6B655D; --ink-faint: #8A8377;
  --line: #DCD8D0; --chip: #1E1A17; --cream: #FFFFFF;
  --radius: 20px; --radius-chip: 6px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--cream); color: var(--ink); font-family: 'Space Grotesk', system-ui, sans-serif; }
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 40px; padding: 24px 16px; }
svg.ic { flex: none; display: block; }

/* Sur ordinateur : un cadre de téléphone à filet (pas d'ombre, règle de l'identité). Sur téléphone :
   plein écran. */
.phone { width: 390px; height: 800px; border: 1px solid var(--line); border-radius: 44px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
@media (max-width: 520px) {
  body { padding: 0; display: block; }
  .phone { width: 100vw; height: 100dvh; border: 0; border-radius: 0; }
  .aside { display: none; }
}
.aside { max-width: 300px; font-size: 14px; line-height: 1.5; color: var(--ink-soft); }
.aside h1 { font-size: 22px; letter-spacing: -0.02em; color: var(--ink); margin: 0 0 8px; }
.aside ol { padding-left: 18px; }
.aside button { font: inherit; background: none; border: 0; padding: 0; color: var(--iris); text-decoration: underline; cursor: pointer; text-align: left; }
.aside .actif { font-weight: 700; color: var(--ink); text-decoration: none; }

.screen { flex: 1; display: flex; flex-direction: column; padding: 18px 22px 26px; overflow-y: auto; animation: entre .28s ease; }
@keyframes entre { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.screen.iris { background: var(--iris); color: #fff; }

.top { display: flex; align-items: center; gap: 12px; min-height: 36px; margin-bottom: 14px; }
.back { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; flex: none; display: grid; place-items: center; }
.iris .back { border-color: rgba(255,255,255,.35); }
.progress { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.iris .progress { background: rgba(255,255,255,.25); }
.progress i { display: block; height: 100%; background: var(--iris); transition: width .3s; }
.iris .progress i { background: #fff; }

/* Sélecteur de langue : sur l'accueil et dans l'en-tête des écrans suivants. */
.langs { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.iris .langs { border-color: rgba(255,255,255,.35); }
.langs button { border: 0; background: none; color: inherit; font: 500 12px 'Space Grotesk', sans-serif; padding: 5px 9px; border-radius: 999px; cursor: pointer; opacity: .7; }
.langs button.on { background: var(--iris); color: #fff; opacity: 1; }
.iris .langs button.on { background: #fff; color: var(--iris); }

h2 { font-size: 30px; line-height: 1.08; letter-spacing: -0.02em; margin: 6px 0 10px; font-weight: 700; }
.sub { font-size: 15px; line-height: 1.45; color: var(--ink-soft); margin: 0 0 20px; }
.iris .sub { color: rgba(255,255,255,.78); }
.grow { flex: 1; }
.wordmark { font-family: 'Bricolage Grotesque', 'Space Grotesk', sans-serif; font-weight: 800; letter-spacing: -0.03em; }

.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: 0; border-radius: 999px; padding: 17px; font: 700 16px 'Space Grotesk', sans-serif; cursor: pointer; margin-top: 10px; }
.btn-gold { background: var(--lime); color: var(--ink); }
.btn-teal { background: var(--iris); color: #fff; }
.btn-teal:disabled { background: var(--line); color: var(--ink-faint); cursor: default; }
.btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn-black { background: #000; color: #fff; }
.link { display: block; width: 100%; background: none; border: 0; font: 500 15px 'Space Grotesk', sans-serif; color: var(--ink-soft); padding: 14px; cursor: pointer; }
.iris .link { color: rgba(255,255,255,.85); }

/* Pastille d'icône : la tuile de l'identité (iris, trait blanc) — même rôle que les tuiles de la page
   d'accueil du site. Sur fond iris, elle passe en filet blanc. */
.tuile { width: 40px; height: 40px; border-radius: 12px; background: var(--iris); color: #fff; display: grid; place-items: center; flex: none; }
.iris .tuile { background: transparent; border: 1px solid rgba(255,255,255,.4); }
.tuile.grande { width: 72px; height: 72px; border-radius: 22px; margin: 26px 0 14px; }

.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 16px; padding: 13px 14px; margin-bottom: 10px; font: 500 15px 'Space Grotesk', sans-serif; cursor: pointer; transition: background .15s, color .15s; }
.opt .tuile { width: 36px; height: 36px; border-radius: 10px; background: transparent; color: var(--iris); border: 1px solid var(--line); }
.opt .tick { margin-left: auto; width: 22px; height: 22px; border-radius: var(--radius-chip); border: 1px solid var(--line); flex: none; display: grid; place-items: center; }
.opt.on { background: var(--iris); color: #fff; border-color: var(--iris); }
.opt.on .tuile { color: #fff; border-color: rgba(255,255,255,.4); }
.opt.on .tick { border-color: #fff; }
.opt small { display: block; font-weight: 400; color: var(--ink-soft); margin-top: 2px; }
.opt.on small { color: rgba(255,255,255,.8); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 .opt { flex-direction: column; align-items: flex-start; margin: 0; padding: 14px; }

.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); color: #fff; font-size: 12px; font-weight: 500; padding: 5px 9px; border-radius: var(--radius-chip); }
.chip-lime { background: var(--lime); color: var(--ink); }
/* Petit drapeau belge dessiné : un emoji 🇧🇪 s'affiche « BE » en lettres sur Windows. */
.be { display: inline-flex; width: 15px; height: 11px; border-radius: 2px; overflow: hidden; }
.be i { flex: 1; } .be i:nth-child(1) { background: #000; } .be i:nth-child(2) { background: #FDDA24; } .be i:nth-child(3) { background: #EF3340; }
.chip-filet { background: transparent; border: 1px solid rgba(255,255,255,.4); margin-top: 4px; }
.gros { display: flex; align-items: flex-end; gap: 12px; }
.gros b { font-size: 88px; line-height: .85; letter-spacing: -0.04em; font-weight: 700; }
.gros span { font-size: 15px; line-height: 1.3; color: rgba(255,255,255,.8); padding-bottom: 4px; }
.gros s { color: #fff; font-weight: 700; }
/* Barres à l'échelle : 32 % = toute la largeur, la partie claire marque la fourchette 22-32 %. */
.barres { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; margin: 10px 0 8px; }
.barres i { display: block; height: 10px; border-radius: 5px; }
.b-autres { background: var(--chip); width: 100%; position: relative; }
.b-autres em { position: absolute; left: 68.75%; right: 0; top: 0; bottom: 0; background: var(--ink-faint); border-radius: 0 5px 5px 0; }
.b-fairide { background: var(--iris); width: 31.25%; }
.tag-prop { display: inline-block; border: 1px dashed currentColor; font-size: 11px; padding: 2px 6px; border-radius: var(--radius-chip); margin-left: 6px; vertical-align: middle; }

.card { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; background: #fff; color: var(--ink); }
.iris .card { border-color: rgba(255,255,255,.3); background: transparent; color: #fff; }
.fact { display: flex; gap: 14px; align-items: flex-start; }
.fact .was { font-size: 13px; color: var(--ink-faint); text-decoration: line-through; display: block; }
.fact b { display: block; font-size: 16px; }
.fact .small { display: block; margin-top: 3px; }
.fact.vedette { border-color: var(--iris); border-width: 2px; }
.fact.vedette b { font-size: 19px; }

/* Cartes à glisser. */
.deck { position: relative; height: 290px; margin: 6px 0 18px; }
.swipe { position: absolute; inset: 0; border: 1px solid var(--line); border-radius: 24px; background: #fff; display: flex; flex-direction: column; justify-content: center; padding: 28px; font-size: 23px; line-height: 1.25; letter-spacing: -0.01em; font-weight: 500; touch-action: none; user-select: none; cursor: grab; }
.swipe .q { font-size: 54px; line-height: .6; color: var(--iris); margin-bottom: 10px; }
.swipe.back2 { transform: scale(.95) translateY(12px); }
.swipe .stamp { position: absolute; top: 20px; padding: 4px 10px; border-radius: var(--radius-chip); font-size: 14px; font-weight: 700; opacity: 0; }
.swipe .yes { right: 20px; background: var(--iris); color: #fff; }
.swipe .no { left: 20px; background: var(--chip); color: #fff; }
.swipe-btns { display: flex; justify-content: center; gap: 28px; }
.round { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.round.ok { background: var(--iris); color: #fff; border-color: var(--iris); }

.biz { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 16px; padding: 10px; margin-bottom: 8px; background: #fff; width: 100%; color: var(--ink); }
.biz .tuile { width: 48px; height: 48px; }
.biz b { display: block; font-size: 15px; }
.biz span { font-size: 13px; color: var(--ink-soft); }

.input { width: 100%; font: 500 22px 'Space Grotesk', sans-serif; letter-spacing: .1em; padding: 16px; border: 1px solid var(--line); border-radius: 16px; text-align: center; }
.input:focus { outline: 2px solid var(--iris); border-color: var(--iris); }

.cercle { width: 190px; height: 190px; display: block; margin: 0 auto 22px; overflow: visible; }
.cercle .zone { fill: rgba(255,255,255,.08); } .cercle .bord { fill: none; stroke: rgba(255,255,255,.45); stroke-width: .8; stroke-dasharray: 2 2; }
.cercle .pt { fill: #fff; } .cercle .moi { fill: var(--lime); }
.cercle.anime .pt { opacity: 0; animation: pop .3s ease forwards; }
.cercle .onde { fill: none; stroke: var(--lime); stroke-width: 1; transform-origin: 50px 50px; animation: onde 1.6s ease-out infinite; }
@keyframes pop { from { opacity: 0; transform: scale(.2); transform-origin: center; transform-box: fill-box; } to { opacity: 1; transform: none; transform-box: fill-box; } }
@keyframes onde { from { transform: scale(.1); opacity: 1; } to { transform: scale(1); opacity: 0; } }
.cercle-petit .cercle { width: 120px; height: 120px; margin: 0 0 10px; }
.cercle-petit .zone { fill: rgba(59,47,181,.06); } .cercle-petit .bord { stroke: var(--iris); }
.cercle-petit .pt { fill: var(--iris); } .cercle-petit .moi { fill: var(--ink); }
.spinner { width: 92px; height: 92px; margin: 0 auto 26px; }
.spinner circle { animation: tourne 1.1s linear infinite; transform-origin: 50% 50%; }
@keyframes tourne { to { transform: rotate(360deg); } }
.steps { list-style: none; padding: 0; margin: 0; font-size: 15px; }
.steps li { padding: 8px 0; opacity: .35; transition: opacity .3s; }
.steps li.done { opacity: 1; }

.tabs { display: flex; border-top: 1px solid var(--line); margin: 0 -22px -26px; padding: 8px 0 14px; }
.tabs div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; color: var(--ink-faint); }
.tabs div.on { color: var(--iris); font-weight: 700; }
.center { text-align: center; }
.small { font-size: 12px; color: var(--ink-faint); }
.iris .small { color: rgba(255,255,255,.65); }
.etape { display: flex; gap: 12px; align-items: center; }
.etape .chip { min-width: 26px; justify-content: center; }
</style>
</head>
<body>

<div class="phone" id="phone"></div>

<aside class="aside">
  <h1>Onboarding de l'app</h1>
  <p>Maquette cliquable — rien n'est branché, commerces d'exemple. Trois parcours selon « Vous êtes… ».</p>
  <ol id="plan"></ol>
  <p><button onclick="recommencer()">↺ Recommencer</button></p>
</aside>

<script>
// ——— Icônes ———
// Les tracés de src/components/Icone.jsx, recopiés au chiffre près (grille 24, trait 1,8, bouts ronds,
// currentColor). Les cinq marqués NOUVEAU n'existent pas encore sur le site.
const TRACES = {
  restaurants: '<path d="M4 3v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M6 12v9"/><path d="M17 3c-1.7 0-3 2.2-3 5s1.3 4 3 4 3 0 3 0V3Z"/><path d="M17 12v9"/>',
  commandes: '<path d="M3 8h18l-1.3 11a2 2 0 0 1-2 1.8H6.3a2 2 0 0 1-2-1.8L3 8Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/>',
  favoris: '<path d="M12 20s-7-4.4-7-9.3A4 4 0 0 1 12 8a4 4 0 0 1 7 2.7C19 15.6 12 20 12 20Z"/>',
  compte: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  commerce: '<path d="M4 9h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9Z"/><path d="M3 9 5 4h14l2 5"/><path d="M9 21v-6h6v6"/>',
  scooter: '<circle cx="5.5" cy="17.5" r="2.5"/><circle cx="18.5" cy="17.5" r="2.5"/><path d="M8 17.5h8"/><path d="M18.5 17.5 16 7h-3"/><path d="M5.5 15V12h6l3.5 5.5"/>',
  sac: '<path d="M5 8h14l-1 12a1 1 0 0 1-1 .9H7a1 1 0 0 1-1-.9L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  euro: '<circle cx="12" cy="12" r="9"/><path d="M16 9.2A4.3 4.3 0 0 0 13 8c-2.2 0-4 1.8-4 4s1.8 4 4 4a4.3 4.3 0 0 0 3-1.2"/><path d="M7.5 11h5"/><path d="M7.5 13.5h5"/>',
  etiquette: '<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9-9-9Z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
  ticket: '<path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h15A1.5 1.5 0 0 1 21 7.5V10a2 2 0 0 0 0 4v2.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 16.5V14a2 2 0 0 0 0-4V7.5Z"/><path d="M13 9.5v5"/>',
  cadeau: '<rect x="3" y="9" width="18" height="12" rx="1"/><path d="M3 13h18"/><path d="M12 9v12"/><path d="M12 9S9.5 9 8.3 7.8a2 2 0 1 1 3-2.6C12.4 6.4 12 9 12 9Z"/><path d="M12 9s2.5 0 3.7-1.2a2 2 0 1 0-3-2.6C11.6 6.4 12 9 12 9Z"/>',
  courrier: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  cadenas: '<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  bouclier: '<path d="M12 3 5 6v5.5c0 4.3 3 7.6 7 9.5 4-1.9 7-5.2 7-9.5V6l-7-3Z"/><path d="m9 12 2 2 4-4"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18"/><path d="M12 3a15 15 0 0 0 0 18"/>',
  boussole: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/>',
  horloge: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l3.5 2"/>',
  interdit: '<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',
  position: '<path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/>',
  cloche: '<path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
  maison: '<path d="m3 10 9-7 9 7"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M10 21v-6h4v6"/>',
  porte: '<path d="M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17"/><path d="M3 21h18"/><circle cx="15" cy="12" r="1"/>',
  apercu: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  coche: '<rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/>',
  balance: '<path d="M12 4v17"/><path d="M4 8.5h16"/><path d="m4 8.5-2.2 6h4.4Z"/><path d="m20 8.5-2.2 6h4.4Z"/><path d="M8 21h8"/><circle cx="12" cy="4" r="1.2"/>',
  tendance: '<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  // Utilitaires de la maquette (flèche retour, coche, croix) — même réglages.
  retour: '<path d="M15 5 8 12l7 7"/>',
  ok: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  croix: '<path d="M6 6l12 12"/><path d="M18 6 6 18"/>',
  // — NOUVEAU : cuisines, pour « Une envie ? » —
  pizza: '<path d="M12 21 3.6 6.5a17 17 0 0 1 16.8 0Z"/><path d="M5.3 9.4a13.5 13.5 0 0 1 13.4 0"/><circle cx="10" cy="12" r="1"/><circle cx="14" cy="13.5" r="1"/>',
  burger: '<path d="M4 11a8 6.5 0 0 1 16 0Z"/><path d="M3 14.5h18"/><path d="M4.5 17.5h15v.5a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2v-.5Z"/>',
  frites: '<path d="M6 11h12l-1.6 10H7.6Z"/><path d="M8 11 7 4.5"/><path d="M11 11V3.5"/><path d="M14 11l.8-6.5"/><path d="M17 11l1.3-5"/>',
  bol: '<path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M9 21h6"/><path d="M8 7.5c1-1.4 3-1.4 4 0s3 1.4 4 0"/>',
  tasse: '<path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9Z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3.5v3"/><path d="M12 3.5v3"/>',
};
const ic = (nom, taille = 20) => `<svg class="ic" width="${taille}" height="${taille}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${TRACES[nom] || ''}</svg>`;
const tuile = (nom, cls = '', taille = 20) => `<span class="tuile ${cls}">${ic(nom, taille)}</span>`;

    <div class="grid2">${['restaurants', 'frites', 'tasse', 'sac'].map((icone, k) => `<button class="opt ${k === 1 ? 'on' : ''}">${tuile(icone, '', 22)}<span>${t('coTypes')[k]}</span></button>`).join('')}</div>
    <div class="grow"></div>
    <button class="btn btn-teal" onclick="suivant()">${t('continuer')}</button>` }),

  commerceNotifs: () => permission('cloche', t('coNotifTitre'), t('coNotifSub'), '', t('notifBtn')),
  commerceEtapes: () => ({ html: `
    <h2>${t('coEtTitre')}</h2>
    <p class="sub">${t('coEtSub')}</p>
    ${etapes(t('coE'))}
    <div class="grow"></div>
    <button class="btn btn-teal" onclick="recommencer()">${t('coEtBtn')}</button>` }),
};

function voter(oui) {
  const c = document.getElementById('carte');
  if (!c) return;
  c.style.transition = 'transform .25s, opacity .25s';
  c.style.transform = `translateX(${oui ? 420 : -420}px) rotate(${oui ? 18 : -18}deg)`;
  c.style.opacity = 0;
  setTimeout(() => {
    S.accord.push(oui);
    if (S.accord.length >= CARTES.length) suivant(); else aller(S.i);
  }, 220);
}
// Glisser au doigt ou à la souris (pointer events) ; au-delà de 90 px la carte part.
function brancherGlisse(el) {
  const c = el.querySelector('#carte'); if (!c) return;
  let x0 = null, dx = 0;
  const oui = c.querySelector('.yes'), non = c.querySelector('.no');
  c.addEventListener('pointerdown', (e) => { x0 = e.clientX; c.setPointerCapture(e.pointerId); c.style.transition = 'none'; });
  c.addEventListener('pointermove', (e) => { if (x0 === null) return; dx = e.clientX - x0; c.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; oui.style.opacity = Math.max(0, dx / 90); non.style.opacity = Math.max(0, -dx / 90); });
  c.addEventListener('pointerup', () => { if (x0 === null) return; x0 = null; if (Math.abs(dx) > 90) voter(dx > 0); else { c.style.transition = 'transform .2s'; c.style.transform = ''; oui.style.opacity = non.style.opacity = 0; } dx = 0; });
}

recommencer();
</script>
</body>
</html>
