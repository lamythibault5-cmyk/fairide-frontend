# Application Android du PLAY STORE (« Fairide », be.fairide.app), reliée à la PRODUCTION.
#
# POURQUOI. Construire le bundle .aab que Google Play demande (Play Console › Test and release › Internal testing ›
# Create new release), signé avec la clé d'ENVOI ; Google le re-signe avec la clé qu'il garde (Play App Signing).
# Lancement à la main seulement (Actions › App Android Play Store › Run workflow) : rien ne part vers le magasin sans
# qu'on l'ait voulu. Le .aab est ENVOYÉ PAR LE BUILD dans Internal testing (testeurs internes, sans revue de Google),
# avec les notes de version tapées au lancement ; il reste aussi dans les artefacts. Jamais vers la production.
# Pourquoi l'envoi direct : l'antivirus de l'ordinateur d'Owen (Defender, « Trojan:JS/Tisifi.A ») bloquait le
# téléchargement du .zip à cause des pages Factures — fausse alerte, voir le message du commit (17 oct. 2026).
#
# CONFIGURATION (Réglages du dépôt › Secrets and variables › Actions).
#   Secrets :
#     ANDROID_UPLOAD_KEYSTORE_BASE64   obligatoire — clé d'envoi (fichier .p12 en base64) ; avec
#     ANDROID_UPLOAD_KEYSTORE_PASSWORD   son mot de passe. Sans elle le build S'ARRÊTE : un .aab non signé est refusé.
#     GOOGLE_SERVICES_JSON             facultatif — le même que pour l'app de test, re-téléchargé APRÈS avoir ajouté
#                                      l'app Android be.fairide.app dans Firebase (sinon pas de notifications push).
#     PLAY_SERVICE_ACCOUNT_JSON        facultatif — clé JSON du compte de service Google Cloud (projet « Fairide »)
#                                      invité dans la Play Console avec « Release to testing tracks » pour Fairide.
#                                      Sans lui, pas d'envoi : le .aab reste à déposer à la main depuis les artefacts.
#   Variables (les mêmes que Vercel › Production) :
#     VITE_GOOGLE_CLIENT_ID, VITE_SENTRY_DSN, VITE_PLAUSIBLE_DOMAIN — facultatives.
#
# Les dates d'ouverture ne sont PAS surchargées : l'application suit les dates du lancement (src/launch.js).
name: App Android Play Store

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Notes de version (en français, vues par les testeurs)'
        required: true
        default: 'Corrections et améliorations.'

concurrency:
  group: app-android-store
  cancel-in-progress: false

jobs:
  aab:
    name: Construire le bundle Play Store
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE: https://fairide-backend-production.up.railway.app/api
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_PLAUSIBLE_DOMAIN: ${{ vars.VITE_PLAUSIBLE_DOMAIN }}
      # Jamais de photos de banque d'images présentées comme les plats d'un vrai commerce (AVANT-PRODUCTION.md).
      VITE_STOCK_DISH_PHOTOS: 'off'
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Site (dist/) relié à la production
        run: npm run build

      # Avant la copie : un greffon oublié dans android.includePlugins manquerait au bundle sans erreur.
      - name: Greffons de l'app Android
        run: npm run check:greffons

      - name: Copie dans le projet Android
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Firebase (notifications), si configuré
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            if grep -q '"package_name": *"be.fairide.app"' android/app/google-services.json; then
              echo "google-services.json posé"
            else
              echo "::warning::google-services.json ne contient pas be.fairide.app : ajouter l'app dans Firebase et mettre le secret à jour."
              rm android/app/google-services.json
            fi
          else
            echo "Sans google-services.json : pas de notifications push dans ce build."
          fi

      - name: Clé d'envoi
        env:
          KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Secrets ANDROID_UPLOAD_KEYSTORE_BASE64 / ANDROID_UPLOAD_KEYSTORE_PASSWORD absents."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/fairide-upload.p12"
          echo "ANDROID_UPLOAD_KEYSTORE=$RUNNER_TEMP/fairide-upload.p12" >> "$GITHUB_ENV"
          echo "ANDROID_UPLOAD_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"

      - name: Bundle .aab
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/fairide-${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: fairide-${{ github.run_number }}
          path: ${{ runner.temp }}/fairide-${{ github.run_number }}.aab
          retention-days: 30

      # Un secret ne se lit pas dans un `if:` : on le teste dans une étape, qui dit oui ou non à la suivante.
      - name: Envoi à la Play Console configuré ?
        id: play
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$SA" ]; then
            echo "Pas de PLAY_SERVICE_ACCOUNT_JSON : le .aab est dans les artefacts, à déposer à la main."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/notes"
          printf '%s' "$NOTES" | head -c 500 > "$RUNNER_TEMP/notes/whatsnew-fr-FR"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Envoi dans Internal testing
        if: steps.play.outputs.ok == 'true'
        # v1.1.5, épinglée par son commit : cette action reçoit la clé du compte de service.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: be.fairide.app
          releaseFiles: ${{ runner.temp }}/fairide-${{ github.run_number }}.aab
          releaseName: ${{ github.run_number }} (1.0)
          track: internal
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/notes
