<!doctype html>
<meta charset="utf-8">
<title>Gabarits d'icônes Fairide</title>
<style>
  html, body { margin: 0; padding: 0; background: #888; }
  .tuile { display: block; line-height: 0; }
  #i192 { width: 192px; height: 192px; }
  #i512 { width: 512px; height: 512px; }
  #imask { width: 512px; height: 512px; }
  #iapple { width: 180px; height: 180px; }
  svg { display: block; width: 100%; height: 100%; }
</style>

<!--
  Gabarits pour produire les PNG du manifeste et l'icône Apple : le vélo « 5a », lime sur iris,
  exactement la géométrie de BrandMark.jsx et de public/icons/icon.svg (retour au vélo le
  2026-09-27 ; ces gabarits portaient le bol « Swept plume » avant).

  Tous opaques et pleine page, SANS coins arrondis : c'est la forme attendue d'une icône
  d'application, les coins sont appliqués par le système. Les PNG du dossier du fondateur
  (« Fairide Logo & Color Brainstorm ») ont des coins arrondis transparents — iOS les remplirait de
  noir, et Android les poserait sur un fond qui n'est pas le nôtre ; ils ne servent qu'aux favicons.

  Le vélo occupe x[28; 104] et y[52; 88] de la tuile : 58 % du côté, donc déjà dans le cercle de
  sécurité (80 %) des icônes « maskable ». Le même dessin sert aux deux, sans réduction.
-->

<div class="tuile" id="i192" role="img" aria-label="icone192">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132">
    <rect width="132" height="132" fill="#3B2FB5"/>
    <g transform="translate(28 44)" fill="none" stroke="#C8F03C" stroke-width="5">
      <circle cx="15" cy="29" r="12.5"/>
      <circle cx="61" cy="29" r="12.5"/>
    </g>
    <g transform="translate(28 44)" fill="#C8F03C">
      <rect x="16" y="8" width="44" height="5" rx="2.5"/>
      <rect x="13" y="20" width="28" height="5" rx="2.5" transform="rotate(42 27 22.5)"/>
    </g>
  </svg>
</div>
