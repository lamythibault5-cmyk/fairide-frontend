<!doctype html>
<meta charset="utf-8">
<title>Gabarits d'icônes Fairide</title>
<style>
  html, body { margin: 0; padding: 0; background: #888; }
  .tuile { display: block; line-height: 0; }
  #i192 { width: 192px; height: 192px; }
  #i512 { width: 512px; height: 512px; }
  #imask { width: 512px; height: 512px; }
  svg { display: block; width: 100%; height: 100%; }
</style>

<!--
  Gabarits pour produire les PNG du manifeste, marque « Swept plume » (FairRide-logo-spec.md).

  Le dessin vit dans une boîte 96×96, mais il ne la remplit pas : traits compris il occupe
  x[13; 88] et y[12; 85], donc son centre est (50,5; 48,5) et non (48; 48). Les deux
  transformations ci-dessous partent de ce centre réel — sinon la marque est posée haut et à
  gauche, d'autant plus visiblement qu'on l'agrandit.

  « any »      : marque à 67% du côté, comme public/icons/icon.svg — l'icône est déjà rognée par
                 l'OS qui veut bien.
  « maskable » : marque à 57%, pour tenir dans le cercle de sécurité (80% du côté) que les
                 lanceurs Android découpent. Sans cette marge, le rebord du bol est tranché.
  Les deux sont opaques et pleine page : c'est la forme attendue d'une icône d'application, et
  les coins arrondis sont appliqués par le système, pas par nous. Les fichiers livrés dans
  brand/ ont, eux, des coins arrondis et un canal alpha — ils ont été aplatis sur l'iris avant
  d'atterrir dans public/icons/.
-->

<div class="tuile" id="i192" role="img" aria-label="icone192">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132">
    <rect width="132" height="132" fill="#3B2FB5"/>
    <g transform="translate(66 66) scale(1.173) translate(-50.5 -48.5)" fill="none">
      <path d="M52 40 C46 26 30 24 16 28" stroke="#C8F03C" stroke-width="6" stroke-linecap="round"/>
      <path d="M66 38 C62 20 42 14 24 15" stroke="#C8F03C" stroke-width="6" stroke-linecap="round" opacity="0.78"/>
      <path d="M76 42 C76 33 68 27 58 25" stroke="#C8F03C" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
      <g transform="rotate(-11 54 58)">
        <path d="M26 58 A27 27 0 0 0 80 58 Z" fill="#C8F03C"/>
        <path d="M21 58 H85" stroke="#C8F03C" stroke-width="7" stroke-linecap="round"/>
      </g>
    </g>
  </svg>
</div>
