<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page introuvable · fairide.be</title>
    <!-- /nl/… et /en/… recevaient cette page en français (constaté le 2026-10-02) : un petit script externe (la CSP
         interdit le script en ligne) la traduit d'après le préfixe de l'adresse. Sans lui, elle reste lisible en français. -->
    <script src="/404-langue.js" defer></script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <!-- Page 404 statique, servie par Vercel avec le VRAI statut 404 pour toute adresse qui ne correspond à aucune
         route de l'application (voir vercel.json : les réécritures vers index.html ne couvrent que les routes
         connues). Sans JavaScript ni dépendance : elle doit s'afficher même si le reste ne charge pas. -->
    <style>
      /* Le mot « fairide » en Bricolage Grotesque, comme partout (voir .wordmark dans styles.css) :
         même fichier auto-hébergé que l'écran de chargement d'index.html. Page statique, sans
         styles.css ni Google Fonts, d'où la déclaration ici. */
      @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 700 800; font-display: swap; src: url("/fonts/bricolage-grotesque-latin.woff2") format("woff2"); }
      :root { --iris: #3B2FB5; --lime: #C8F03C; --ink: #000; --ink-soft: #5E5E5E; --line: #E6E4EE; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; min-height: 100vh; display: flex; flex-direction: column; }
      header { background: var(--iris); padding: 14px 24px; }
      header a { display: inline-flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; font-weight: 800; font-size: 28px; letter-spacing: -0.04em; }
      header a span { font-family: "Bricolage Grotesque", "Inter", system-ui, sans-serif; letter-spacing: -0.03em; }
      header svg { width: 64px; height: 33px; display: block; }
      main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; }
      .boite { max-width: 520px; }
      .code { font-size: 96px; font-weight: 800; letter-spacing: -0.06em; color: var(--iris); line-height: 1; margin: 0 0 8px; }
      h1 { font-size: 28px; margin: 0 0 10px; letter-spacing: -0.02em; }
      p { color: var(--ink-soft); margin: 0 0 24px; line-height: 1.5; }
      .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 22px; border-radius: 999px; font-weight: 700; text-decoration: none; font-size: 15px; }
      .btn-lime { background: var(--lime); color: var(--ink); }
      .btn-outline { border: 1px solid var(--line); color: var(--ink); }
      footer { padding: 16px 24px; font-size: 13px; color: var(--ink-soft); text-align: center; border-top: 1px solid var(--line); }
      footer a { color: var(--ink-soft); margin: 0 6px; }
    </style>
  </head>
  <body>
    <header>
      <a href="/" aria-label="fairide.be, accueil">
        <svg viewBox="-3 5 82 42" aria-hidden="true"><g fill="none" stroke="#C8F03C" stroke-width="5" stroke-linecap="round"><circle cx="15" cy="29" r="12.5"/><circle cx="61" cy="29" r="12.5"/></g><g fill="#C8F03C"><rect x="16" y="8" width="44" height="5" rx="2.5"/><g transform="rotate(42 27 22.5)"><rect x="13" y="20" width="28" height="5" rx="2.5"/></g></g></svg>
        <span>fairide</span>
      </a>
    </header>
    <main>
      <div class="boite">
        <p class="code">404</p>
        <h1 data-t="titre">Cette page n'existe pas</h1>
        <p data-t="texte">Le lien est peut-être périmé, ou l'adresse comporte une faute de frappe. Les commerces, eux, sont toujours là.</p>
        <div class="actions">
          <a class="btn btn-lime" href="/restaurants" data-t="commerces" data-href="/restaurants">Voir les commerces</a>
          <a class="btn btn-outline" href="/" data-t="accueil" data-href="/">Retour à l'accueil</a>
        </div>
      </div>
    </main>
    <footer>
      <a href="/mentions-legales" data-t="mentions" data-href="/mentions-legales">Mentions légales</a> · <a href="/confidentialite" data-t="confidentialite" data-href="/confidentialite">Confidentialité</a> · <a href="/cgv" data-t="cgv" data-href="/cgv">Conditions générales</a> · <a href="/aide" data-t="aide" data-href="/aide">Aide</a>
    </footer>
  </body>
</html>
