<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Déclinaison ≤32px de la marque « Swept plume » (FairRide-logo-spec.md, §« Small-size /
       favicon mark »). À cette taille les trois traits de vapeur se collent en une bavure : on n'en
       garde qu'un, et les épaisseurs passent de 6/7 à 9 pour que le dessin survive au sous-pixel.
