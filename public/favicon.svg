  <g transform="translate(48 50) scale(0.84) translate(-48 -48)" fill="none">
    <path d="M58 44 C52 26 30 20 12 24" stroke="#C8F03C" stroke-width="9" stroke-linecap="round"/>
    <path d="M18 64 A32 32 0 0 0 82 64 Z" fill="#C8F03C"/>
