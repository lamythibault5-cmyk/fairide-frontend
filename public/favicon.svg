  <g fill="none" stroke="#C8F03C" stroke-width="2">
    <circle cx="7.5" cy="16.5" r="2.5"/>
    <circle cx="16.5" cy="16.5" r="2.5"/>
  </g>
  <rect x="7" y="7" width="10" height="2" rx="1" fill="#C8F03C"/>
</svg>
