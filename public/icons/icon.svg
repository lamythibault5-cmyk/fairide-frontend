<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" width="512" height="512">
  <!-- Icône d'application Fairide — marque « Swept plume » en lime sur tuile iris, rayon 32/132 = 24%
       du côté (FairRide-logo-spec.md, §« App icon »).
       La marque est dessinée dans une boîte 96×96 ; `scale(0.9167)` la ramène à 88 unités, soit 67%
       de la tuile, et `translate(22 22)` laisse les 22 unités de marge identiques sur les quatre côtés. -->
  <rect width="132" height="132" rx="32" fill="#3B2FB5"/>
  <g transform="translate(22 22) scale(0.9167)" fill="none">
    <!-- La vapeur : trois traits qui s'effacent vers l'arrière (opacité 1 / 0,78 / 0,55). C'est le seul
         indice de mouvement — pas de lignes de vitesse, pas de véhicule (spec, §« Don'ts »). -->
    <path d="M52 40 C46 26 30 24 16 28" stroke="#C8F03C" stroke-width="6" stroke-linecap="round"/>
    <path d="M66 38 C62 20 42 14 24 15" stroke="#C8F03C" stroke-width="6" stroke-linecap="round" opacity="0.78"/>
    <path d="M76 42 C76 33 68 27 58 25" stroke="#C8F03C" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <!-- Le bol : demi-disque r=27 centré en (53, 58), rebord de 7 unités de x=21 à x=85, l'ensemble
         penché de −11° autour de (54, 58). Ne jamais dépasser cet angle ni renverser la vapeur à droite. -->
    <g transform="rotate(-11 54 58)">
      <path d="M26 58 A27 27 0 0 0 80 58 Z" fill="#C8F03C"/>
      <path d="M21 58 H85" stroke="#C8F03C" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
</svg>
