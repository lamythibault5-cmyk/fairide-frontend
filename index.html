<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon en data-URI (pas de requête réseau au premier rendu) : déclinaison 24px du vélo
         « 5a » — les deux roues et le tube supérieur ; à cette taille le tube de selle se colle aux
         roues. Retour au vélo le 2026-09-27 (voir BrandMark.jsx).

         Les trois fichiers qui suivent viennent du lot SEO de `main` et gardent SES chemins : le .ico
         pour les agrégateurs et les vieux navigateurs, le PNG 32 pour les onglets, l'icône Apple pour
         l'écran d'accueil iOS. Leur dessin est le vélo, régénéré le 2026-09-27 depuis la tuile du fondateur. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233B2FB5'/%3E%3Cg fill='none' stroke='%23C8F03C' stroke-width='2'%3E%3Ccircle cx='7.5' cy='16.5' r='2.5'/%3E%3Ccircle cx='16.5' cy='16.5' r='2.5'/%3E%3C/g%3E%3Crect x='7' y='7' width='10' height='2' rx='1' fill='%23C8F03C'/%3E%3C/svg%3E" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3B2FB5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fairide.be · Livraison et commerces locaux à Bruxelles</title>
    <!-- Aligné sur l'accroche de la page (voir landing.title1/2 et landing.sub dans i18n/fr.js) : le
         titre de la page disait « Paie ton repas, pas la plateforme » et la description parlait encore
         des commerces du quartier — deux positionnements différents sur la même adresse.
         Uber Eats et Deliveroo ne sont PAS nommés ici, alors qu'ils le sont dans le corps de la page :
         citer la marque d'un concurrent dans une balise meta relève de l'usage de marque en métadonnée,
         qui a sa propre jurisprudence, distincte de la publicité comparative en clair sur la page. Le
         gain de clarté serait nul — personne ne lit une meta, elle est lue par un moteur.
         Longueur tenue sous ~155 caractères, au-delà Google tronque. -->
    <meta name="description" content="Restaurants et commerces de Bruxelles : commande, réserve ou emporte avec Fairide, l'alternative belge. 10 % de commission au lieu de 22 à 32 %." />
    <link rel="canonical" href="https://fairide.be/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fairide" />
    <meta property="og:locale" content="fr_BE" />
    <meta property="og:url" content="https://fairide.be/" />
    <!-- Le titre partagé était en anglais sur un site dont la langue par défaut est le français et
         dont og:locale annonce fr_BE. Il reprend maintenant, mot pour mot, le titre de la page. -->
    <meta property="og:title" content="Fairide · Paie ton repas, pas la plateforme." />
    <meta property="og:description" content="L'alternative belge : 10 % de commission au lieu de 22 à 32 %, le restaurant garde plus, le livreur touche 100 % des frais de livraison, et l'argent reste ici." />
    <meta property="og:image" content="https://fairide.be/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- og-image.png refait le 2026-09-27 : le vélo et l'accroche actuelle, en dur dans le visuel.
         Si l'accroche change (landing.title1/2), refaire l'image ET ce texte ensemble. -->
    <meta property="og:image:alt" content="Fairide : paie ton repas, pas la plateforme." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fairide · Paie ton repas, pas la plateforme." />
    <meta name="twitter:description" content="L'alternative belge à Bruxelles : 10 % de commission au lieu de 22 à 32 %, et l'argent reste ici." />
    <meta name="twitter:image" content="https://fairide.be/og-image.png" />

    <!-- Pré-connexion à l'API : la poignée de main TLS se fait pendant que le code se charge, le premier
         appel (liste des commerces, session) part sans attendre. -->
    <link rel="preconnect" href="https://fairide-backend-production.up.railway.app" crossorigin />

    <!-- LES DEUX POLICES EN UNE SEULE REQUÊTE.

         Space Grotesk porte toute l'interface. Bricolage Grotesque ne sert qu'au mot « fairide »
         (voir .wordmark dans styles.css) : c'est une police de LOGOTYPE, pas une seconde police
         d'interface — ne pas l'étendre aux titres, ce serait rouvrir le couple serif/sans que la
         direction avait refermé en retirant Fraunces.

         Les deux familles tiennent dans une seule URL css2 (ordre alphabétique imposé par Google
         Fonts), donc un seul aller-retour au lieu de deux.

         PAS DE `media="print" onload="this.media='all'"` ICI, ET C'EST IMPORTANT. Ce motif — charger
         la feuille comme hors écran puis la rebasculer une fois arrivée — est la façon habituelle de
         ne pas bloquer le rendu, et il était en place. Il ne marche pas sur ce site : `onload` sur
         une balise est un gestionnaire EN LIGNE, et notre Content-Security-Policy (vercel.json)
         déclare `script-src 'self' …` sans `'unsafe-inline'`. Le navigateur bloque donc le
         gestionnaire, la feuille reste en `media="print"`, et AUCUNE des deux polices ne s'applique.
         Vérifié sur fairide.be : tout le site tombait sur la police système, pas seulement le mot
         « fairide » — c'est simplement là qu'on l'a remarqué. Le <noscript> ne rattrapait rien, il
         ne couvre que le cas où JavaScript est absent, pas celui où il est autorisé mais bridé.

         LA FEUILLE RESTE DONC EN `media="print"`, ET C'EST main.jsx QUI LA RALLUME. La bascule se
         fait depuis un fichier servi par nous, que `script-src 'self'` autorise déjà — c'est la
         seule partie du motif qui manquait.

         Ne PAS la remettre en feuille ordinaire pour se passer de cette bascule : une feuille de
         style dans le <head> bloque l'exécution de tout script qui la suit, et le script qui la
         suit ici, c'est l'application entière. Le démarrage se retrouvait suspendu à une requête
         vers un tiers — si fonts.googleapis.com est lent, coupé, ou bloqué par un filtre de contenu
         (courant sur iOS), on reste indéfiniment sur l'écran de chargement. Essayé le 2026-09-18,
         constaté aussitôt. Avec `media="print"`, la feuille ne bloque ni le rendu ni les scripts :
         une police d'affichage ne doit jamais pouvoir empêcher le site de démarrer.

         Et `display=swap` garantit que le texte s'affiche tout de suite dans la police de repli.

         Une seule tranche d'axes pour Bricolage : graisses 700 à 800, taille optique (opsz) laissée
         variable, ce que demandent ses sept emplacements entre 17 et 34px. On a écarté
         `&text=fairide`, qui aurait réduit le fichier à deux kilo-octets : le jour où quelqu'un pose
         .wordmark sur un autre mot, les glyphes manquants retomberaient en silence sur la police de
         repli, sans rien dans la console pour l'expliquer. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" media="print" data-police />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" /></noscript>
    <!-- Le script Google Sign-In N'EST PLUS chargé ici. Posé dans ce <head>, il partait sur toutes les
         pages et avant toute réponse à la bannière cookies, alors qu'il ne sert qu'à /login : Google
         déposait ses traceurs sur l'accueil, sur une carte de restaurant, sur les pages légales. C'est
         le défaut déjà corrigé pour Sentry (voir src/main.jsx) — le laisser ici vidait de son sens tout
         le travail fait sur le consentement.
         Il est désormais chargé à la demande par src/googleSignIn.js, depuis Auth.jsx seulement, au
         moment de dessiner le bouton. Le raisonnement complet est en tête de ce fichier-là. -->
  </head>
  <body>
    <!-- Écran de chargement (fondateur, 2026-09-17) : plein écran iris avec le logo qui se dessine UNE fois
         (même séquence que BrandMark.jsx), visible dès l'analyse du HTML, avant tout JavaScript. Styles et
         animation en ligne parce que styles.css n'est pas encore chargé. main.jsx le retire dès que la
         page est réellement rendue (application montée, plus de squelette), sans jamais retarder : il couvre
         le chargement, il ne le prolonge pas. -->
    <div id="splash" aria-hidden="true">
      <style>
        #splash { position: fixed; inset: 0; z-index: 1000; background: #3B2FB5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .2s ease; will-change: opacity; }
        #splash.splash-fin { opacity: 0; pointer-events: none; }
        /* 220px : le vélo est en paysage (82 × 42, soit 220 × 113 ici). Le bol carré, du 2026-09-18
           au 2026-09-27, tenait à 160 ; retour au vélo, retour à 220. */
        #splash svg { width: min(52vw, 220px); height: auto; display: block; shape-rendering: geometricPrecision; }
        /* Le nom arrive une fois la marque posée — pendant que les tubes finissent de s'allonger.
           Bricolage Grotesque comme partout où le mot « fairide » est écrit ; la pile de repli sert
           le temps que le fichier arrive, et le fondu de 0,66 s lui laisse justement le temps. */
        #splash .splash-nom { font: 800 34px/1 "Bricolage Grotesque", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -0.04em; color: #fff; opacity: 0; animation: splash-nom .3s .66s ease forwards; }
        /* Même séquence que BrandMark.jsx (voir « Logo animé » dans styles.css) : roues, tubes, moyeux. */
        #splash .bm-roue { stroke-dasharray: 79; stroke-dashoffset: 79; animation: bm-roue .5s cubic-bezier(.4, 0, .2, 1) forwards; }
        #splash .bm-roue-avant { animation-delay: .08s; }
        #splash .bm-tube { opacity: 0; transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: bm-tube .32s cubic-bezier(.2, .8, .2, 1) forwards; }
        #splash .bm-tube-haut { animation-delay: .38s; }
        #splash .bm-tube-selle { animation-delay: .5s; }
        #splash .bm-moyeu { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: bm-pop .28s .68s cubic-bezier(.34, 1.56, .64, 1) forwards; }
        @keyframes bm-roue { to { stroke-dashoffset: 0; } }
        @keyframes bm-tube { to { opacity: 1; transform: scaleX(1); } }
        @keyframes bm-pop { to { transform: scale(1); } }
        @keyframes splash-nom { to { opacity: 1; } }
        /* PORTE DE SORTIE, EN CSS SEUL — parce que tout le reste du filet est en JavaScript.
           L'écran est retiré par main.jsx, avec un plafond de 2,5 s ; lazyPage.js rattrape un
           morceau de code manquant. Les deux supposent que le JavaScript s'exécute. S'il ne
           s'exécute pas — script d'entrée absent après une mise en ligne alors qu'un onglet était
           resté ouvert, coupure au mauvais moment, connexion trop lente, extension qui bloque —
           il ne reste RIEN : l'animation tourne, puis se fige, et le visiteur n'a aucune indication
           ni aucun moyen d'agir. C'est précisément ce qui a été signalé.
           Ce message est en pur CSS : il apparaît au bout de 8 s même si pas une ligne de
           JavaScript n'a tourné. Le lien est un <a href> ordinaire, donc cliquable sans JavaScript
           lui aussi. Si l'application démarre normalement, l'écran est retiré bien avant et
           personne ne le voit jamais. */
        #splash .splash-secours { opacity: 0; animation: splash-secours 0s 8s forwards; text-align: center; max-width: 30ch; }
        #splash .splash-secours p { margin: 0 0 10px; color: #fff; opacity: .85; font: 400 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        #splash .splash-secours a { display: inline-block; background: #C8F03C; color: #14121F; text-decoration: none; font: 700 14px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 11px 18px; border-radius: 6px; }
        @keyframes splash-secours { to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
          #splash .bm-roue, #splash .bm-tube, #splash .bm-moyeu { animation: none; stroke-dashoffset: 0; opacity: 1; transform: none; }
          #splash .splash-nom { animation: none; opacity: 1; }
        }
      </style>
      <svg viewBox="-3 5 82 42" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#C8F03C" stroke-width="5" stroke-linecap="round">
          <circle class="bm-roue" cx="15" cy="29" r="12.5" />
          <circle class="bm-roue bm-roue-avant" cx="61" cy="29" r="12.5" />
        </g>
        <g fill="#C8F03C">
          <rect class="bm-tube bm-tube-haut" x="16" y="8" width="44" height="5" rx="2.5" />
          <g transform="rotate(42 27 22.5)"><rect class="bm-tube bm-tube-selle" x="13" y="20" width="28" height="5" rx="2.5" /></g>
          <circle class="bm-moyeu" cx="15" cy="29" r="2.4" />
          <circle class="bm-moyeu" cx="61" cy="29" r="2.4" />
        </g>
      </svg>
      <span class="splash-nom wordmark">fairide</span>
      <!-- Invisible pendant 8 s, puis affiché sans que rien n'ait à s'exécuter. `?r=` casse le cache
           du navigateur ET celui des intermédiaires : un simple rechargement resservirait la page
           périmée qui a justement causé le blocage. -->
      <div class="splash-secours">
        <p>Le chargement prend plus de temps que prévu.</p>
        <a href="/?r=1" rel="nofollow">Recharger la page</a>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
