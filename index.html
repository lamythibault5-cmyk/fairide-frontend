<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon en data-URI (pas de requête réseau au premier rendu) : déclinaison ≤32px de la marque
         « Swept plume » — bol + rebord + un seul trait de vapeur, les deux traits pâles ne se lisent
         plus à cette taille (FairRide-logo-spec.md, §« Small-size / favicon mark »).

         Les trois fichiers qui suivent viennent du lot SEO de `main` et gardent SES chemins : le .ico
         pour les agrégateurs et les vieux navigateurs, le PNG 32 pour les onglets, l'icône Apple pour
         l'écran d'accueil iOS. Seul leur DESSIN a changé — ils étaient encore au vélo. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='24' fill='%233B2FB5'/%3E%3Cg transform='translate(48 50) scale(0.84) translate(-48 -48)' fill='none'%3E%3Cpath d='M58 44 C52 26 30 20 12 24' stroke='%23C8F03C' stroke-width='9' stroke-linecap='round'/%3E%3Cpath d='M18 64 A32 32 0 0 0 82 64 Z' fill='%23C8F03C'/%3E%3Cpath d='M12 64 H88' stroke='%23C8F03C' stroke-width='9' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3B2FB5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fairide.be · Livraison et commerces locaux à Bruxelles</title>
    <meta name="description" content="Sur fairide.be, commande, réserve une table ou emporte chez les restaurants et commerces de ton quartier à Bruxelles. Commission plafonnée à 10 % pour les commerçants." />
    <link rel="canonical" href="https://fairide.be/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fairide" />
    <meta property="og:locale" content="fr_BE" />
    <meta property="og:url" content="https://fairide.be/" />
    <meta property="og:title" content="Fairide · Pay the meal, not the platform." />
    <meta property="og:description" content="Les commerces du quartier, livrés à domicile. Commission plafonnée à 10% pour soutenir les restaurants et livreurs locaux de Bruxelles." />
    <meta property="og:image" content="https://fairide.be/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fairide, paie ta commande, pas la plateforme." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fairide · Pay the meal, not the platform." />
    <meta name="twitter:description" content="Les commerces du quartier, livrés à domicile. Commission plafonnée à 10% à Bruxelles." />
    <meta name="twitter:image" content="https://fairide.be/og-image.png" />

    <!-- Pré-connexion à l'API : la poignée de main TLS se fait pendant que le code se charge, le premier
         appel (liste des commerces, session) part sans attendre. -->
    <link rel="preconnect" href="https://fairide-backend-production.up.railway.app" crossorigin />

    <!-- Bricolage Grotesque — la police du SEUL mot « fairide » (voir .wordmark dans styles.css).
         Tout le reste de l'interface est en Space Grotesk, importée depuis styles.css.

         Pourquoi ici, dans le <head>, et non en @import comme Space Grotesk : styles.css est chargée
         par main.jsx, donc par le graphe de modules JavaScript. L'écran de chargement ci-dessous,
         lui, s'affiche à l'analyse du HTML, bien avant. Un @import arriverait trop tard pour lui et
         le nom s'afficherait d'abord en Inter, puis sauterait en Bricolage sous les yeux du visiteur.
         Le <link> part dès la première passe de l'analyseur, en parallèle du reste.

         Une seule tranche d'axes : graisses 700 à 800, la taille optique (opsz) restant variable —
         c'est exactement ce que les six occurrences du mot demandent, entre 17px et 34px. On a écarté
         `&text=fairide`, qui aurait réduit le fichier à deux kilo-octets : le jour où quelqu'un pose
         la classe .wordmark sur un autre mot, les glyphes manquants retomberaient en silence sur la
         police de repli, sans rien dans la console pour l'expliquer. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&display=swap" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <!-- Écran de chargement (fondateur, 2026-09-17) : plein écran iris avec le logo qui se dessine UNE fois
         (même séquence que BrandMark.jsx), visible dès l'analyse du HTML, avant tout JavaScript. Styles et
         animation en ligne parce que styles.css n'est pas encore chargé. main.jsx le retire dès que la
         page est réellement rendue (application montée, plus de squelette), sans jamais retarder : il couvre
         le chargement, il ne le prolonge pas. -->
    <div id="splash" aria-hidden="true">
      <style>
        #splash { position: fixed; inset: 0; z-index: 1000; background: #3B2FB5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .2s ease; will-change: opacity; }
        #splash.splash-fin { opacity: 0; pointer-events: none; }
        /* 160px et non plus 220 : le bol est carré là où le vélo était en paysage (220 × 113). À
           largeur égale il occuperait le double de hauteur et écraserait le nom en dessous. */
        #splash svg { width: min(38vw, 160px); height: auto; display: block; shape-rendering: geometricPrecision; }
        /* Le nom arrive une fois la marque posée — après le bol, pendant que la vapeur s'échappe.
           Bricolage Grotesque comme partout où le mot « fairide » est écrit ; la pile de repli sert
           le temps que le fichier arrive, et le fondu de 0,66 s lui laisse justement le temps. */
        #splash .splash-nom { font: 800 34px/1 "Bricolage Grotesque", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -0.04em; color: #fff; opacity: 0; animation: splash-nom .3s .66s ease forwards; }
        #splash .bm-rebord { stroke-dasharray: 100; stroke-dashoffset: 100; animation: bm-tracer .42s cubic-bezier(.4, 0, .2, 1) forwards; }
        #splash .bm-bol { transform-box: fill-box; transform-origin: center top; transform: scaleY(0); animation: bm-bol .34s .26s cubic-bezier(.2, .8, .2, 1) forwards; }
        #splash .bm-vapeur { stroke-dasharray: 100; stroke-dashoffset: 100; animation: bm-tracer .4s cubic-bezier(.4, 0, .2, 1) forwards; }
        #splash .bm-vapeur-1 { animation-delay: .46s; }
        #splash .bm-vapeur-2 { animation-delay: .58s; }
        #splash .bm-vapeur-3 { animation-delay: .7s; }
        @keyframes bm-tracer { to { stroke-dashoffset: 0; } }
        @keyframes bm-bol { to { transform: scaleY(1); } }
        @keyframes splash-nom { to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
          /* Pas de `opacity: 1` sur la vapeur : la déclaration CSS écraserait l'attribut SVG et les
             trois traits perdraient leur dégradé 1 / 0,78 / 0,55. Le nom, lui, en a besoin. */
          #splash .bm-rebord, #splash .bm-bol, #splash .bm-vapeur { animation: none; stroke-dashoffset: 0; transform: none; }
          #splash .splash-nom { animation: none; opacity: 1; }
        }
      </style>
      <svg viewBox="11 9 79 79" xmlns="http://www.w3.org/2000/svg">
        <g fill="none">
          <path class="bm-vapeur bm-vapeur-1" pathLength="100" d="M52 40 C46 26 30 24 16 28" stroke="#C8F03C" stroke-width="6" stroke-linecap="round" />
          <path class="bm-vapeur bm-vapeur-2" pathLength="100" d="M66 38 C62 20 42 14 24 15" stroke="#C8F03C" stroke-width="6" stroke-linecap="round" opacity="0.78" />
          <path class="bm-vapeur bm-vapeur-3" pathLength="100" d="M76 42 C76 33 68 27 58 25" stroke="#C8F03C" stroke-width="6" stroke-linecap="round" opacity="0.55" />
          <g transform="rotate(-11 54 58)">
            <path class="bm-bol" d="M26 58 A27 27 0 0 0 80 58 Z" fill="#C8F03C" />
            <path class="bm-rebord" pathLength="100" d="M21 58 H85" stroke="#C8F03C" stroke-width="7" stroke-linecap="round" />
          </g>
        </g>
      </svg>
      <span class="splash-nom wordmark">fairide</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
