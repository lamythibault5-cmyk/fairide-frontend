<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon en data-URI (pas de requête réseau au premier rendu) : déclinaison 24px de la marque —
         deux roues + tube supérieur seulement, les tubes inclinés ne se lisent plus à cette taille. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233B2FB5'/%3E%3Cg fill='none' stroke='%23C8F03C' stroke-width='2'%3E%3Ccircle cx='7.5' cy='16.5' r='2.5'/%3E%3Ccircle cx='16.5' cy='16.5' r='2.5'/%3E%3C/g%3E%3Crect x='7' y='7' width='10' height='2' rx='1' fill='%23C8F03C'/%3E%3C/svg%3E" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3B2FB5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fairide.be · Livraison et commerces locaux à Bruxelles</title>
    <meta name="description" content="Sur fairide.be, commande, réserve une table ou emporte chez les restaurants et commerces de ton quartier à Bruxelles. Commission plafonnée à 10 % pour les commerçants." />
    <link rel="canonical" href="https://fairide.be/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fairide" />
    <meta property="og:locale" content="fr_BE" />
    <meta property="og:url" content="https://fairide.be/" />
    <meta property="og:title" content="Fairide · Pay the meal, not the platform." />
    <meta property="og:description" content="Les commerces du quartier, livrés à domicile. Commission plafonnée à 10% pour soutenir les restaurants et livreurs locaux de Bruxelles." />
    <meta property="og:image" content="https://fairide.be/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fairide, paie ta commande, pas la plateforme." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fairide · Pay the meal, not the platform." />
    <meta name="twitter:description" content="Les commerces du quartier, livrés à domicile. Commission plafonnée à 10% à Bruxelles." />
    <meta name="twitter:image" content="https://fairide.be/og-image.png" />

    <!-- Pré-connexion à l'API : la poignée de main TLS se fait pendant que le code se charge, le premier
         appel (liste des commerces, session) part sans attendre. -->
    <link rel="preconnect" href="https://fairide-backend-production.up.railway.app" crossorigin />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <!-- Écran de chargement (fondateur, 2026-09-17) : plein écran iris avec le logo qui se dessine UNE fois
         (même séquence que BrandMark.jsx), visible dès l'analyse du HTML, avant tout JavaScript. Styles et
         animation en ligne parce que styles.css n'est pas encore chargé. main.jsx le retire dès que la
         page est réellement rendue (application montée, plus de squelette), sans jamais retarder : il couvre
         le chargement, il ne le prolonge pas. -->
    <div id="splash" aria-hidden="true">
      <style>
        #splash { position: fixed; inset: 0; z-index: 1000; background: #3B2FB5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .2s ease; will-change: opacity; }
        #splash.splash-fin { opacity: 0; pointer-events: none; }
        #splash svg { width: min(46vw, 220px); height: auto; display: block; shape-rendering: geometricPrecision; }
        #splash .splash-nom { font: 800 34px/1 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -0.04em; color: #fff; opacity: 0; animation: splash-nom .3s .78s ease forwards; }
        #splash .bm-roue { stroke-dasharray: 79; stroke-dashoffset: 79; animation: bm-roue .5s cubic-bezier(.4, 0, .2, 1) forwards; }
        #splash .bm-roue-avant { animation-delay: .08s; }
        #splash .bm-tube { opacity: 0; transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: bm-tube .32s cubic-bezier(.2, .8, .2, 1) forwards; }
        #splash .bm-tube-haut { animation-delay: .38s; }
        #splash .bm-tube-selle { animation-delay: .5s; }
        #splash .bm-moyeu { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: bm-pop .28s .68s cubic-bezier(.34, 1.56, .64, 1) forwards; }
        @keyframes bm-roue { to { stroke-dashoffset: 0; } }
        @keyframes bm-tube { to { opacity: 1; transform: scaleX(1); } }
        @keyframes bm-pop { to { transform: scale(1); } }
        @keyframes splash-nom { to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
          #splash .bm-roue, #splash .bm-tube, #splash .bm-moyeu, #splash .splash-nom { animation: none; stroke-dashoffset: 0; opacity: 1; transform: none; }
        }
      </style>
      <svg viewBox="-3 5 82 42" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#C8F03C" stroke-width="5" stroke-linecap="round">
          <circle class="bm-roue" cx="15" cy="29" r="12.5" />
          <circle class="bm-roue bm-roue-avant" cx="61" cy="29" r="12.5" />
        </g>
        <g fill="#C8F03C">
          <rect class="bm-tube bm-tube-haut" x="16" y="8" width="44" height="5" rx="2.5" />
          <g transform="rotate(42 27 22.5)"><rect class="bm-tube bm-tube-selle" x="13" y="20" width="28" height="5" rx="2.5" /></g>
          <circle class="bm-moyeu" cx="15" cy="29" r="2.4" />
          <circle class="bm-moyeu" cx="61" cy="29" r="2.4" />
        </g>
      </svg>
      <span class="splash-nom">fairide</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
